; PlatformIO 项目配置 — arc_remote (Arduino UNO 协控固件)
; 用法:
;   pio run              编译
;   pio run -t upload    烧录(先拔掉 D0/D1 与 DTU 的串口线)
;   pio device monitor   板载 USB 串口监视(与 D0/D1 共用,烧录/监视时勿接 DTU)
;   调试日志走 SoftwareSerial(D5) — 需另接 USB-TTL 适配器,与 DTU 串口互不干扰

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
